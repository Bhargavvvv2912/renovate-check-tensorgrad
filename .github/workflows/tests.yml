name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      # The same ladder aura.environment climbs. pip 24.1 skips any release
      # whose metadata is not valid PEP 440 and then reports it as missing, so
      # a baseline that needs an older installer would fail here and every
      # Dependabot pull request with it -- scoring this arm on a repository
      # that never worked rather than on what Dependabot proposed.
      # Then, as the arms do, the build tools of the pins' own era for a
      # source distribution a current setuptools can no longer build.
      - run: |
          python -m pip install -r requirements.txt || { python -m pip install -q pip==24.0 && python -m pip install -r requirements.txt; } || { python -m pip install -q setuptools==49.2.0 wheel==0.34.2 && python -m pip install --no-build-isolation -r requirements.txt; }
          python -m pip install "setuptools<70"
          python -m pip install -e ./tensorly -e ./neuraloperator
      # --deselect: tests that fail before anything is bumped. CI judges a
      # pull request absolutely, the arms judge against the baseline; without
      # this the project's own broken test fails every pull request.
      - run: python -m pytest neuralop/layers/tests/test_attention_layer.py neuralop/layers/tests/test_finite_difference_conv.py neuralop/layers/tests/test_fno_block.py neuralop/layers/tests/test_grid_embeddings.py neuralop/layers/tests/test_legacy_spectral_convolution.py neuralop/layers/tests/test_local_no_block.py neuralop/layers/tests/test_neighbor_search.py neuralop/layers/tests/test_padding.py neuralop/layers/tests/test_resample.py neuralop/layers/tests/test_segment_csr.py neuralop/layers/tests/test_spectral_convolution.py neuralop/layers/tests/test_spherical_convolution.py neuralop/losses/tests/test_losses.py --deselect neuralop/layers/tests/test_local_no_block.py::test_LocalNOBlock_norm[2-ada_in] --deselect neuralop/layers/tests/test_local_no_block.py::test_LocalNOBlock_norm[2-group_norm] --deselect neuralop/layers/tests/test_local_no_block.py::test_LocalNOBlock_norm[2-instance_norm] --deselect neuralop/layers/tests/test_local_no_block.py::test_LocalNOBlock_resolution_scaling_factor[2]
        working-directory: neuraloperator
